---
macosx64-metal:
    description: "Metal toolchain"
    attributes:
        local-toolchain: true
    worker-type: b-osx-arm64
    treeherder:
        symbol: TM(metal)
    worker:
        max-run-time: 1800
    run:
        script: unpack-metal.py
        toolchain-artifact: project/gecko/mac-toolchain/metal.tar.zst
        toolchain-alias: macosx64-aarch64-metal
