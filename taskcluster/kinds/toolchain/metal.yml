---
macosx64-metal:
    description: "Xcode MetalToolchain component 27A266a"
    treeherder:
        symbol: TM(metal)
    worker-type: b-osx-arm64
    worker:
        max-run-time: 1800
    run:
        script: private_local_toolchain.sh
        arguments:
            - unpack-metal.py
        resources:
            - taskcluster/scripts/misc/unpack-metal.py
        toolchain-artifact: project/gecko/metal/metal.tar.zst
    # Expiry similar to that of fetches
    expires-after: 1000 years
