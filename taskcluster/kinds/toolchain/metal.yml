---
macosx64-metal:
    description: "Xcode MetalToolchain component 17F109"
    treeherder:
        symbol: TM(metal)
    worker-type: b-linux-docker-amd
    worker:
        max-run-time: 1800
    run:
        script: private_local_toolchain.sh
        arguments:
            - unpack-metal.py
            - http://taskcluster/tooltool.mozilla-releng.net/sha512/TOOLTOOL_SHA512_TODO
            - TOOLTOOL_SHA512_TODO
            - Metal.xctoolchain
        resources:
            - taskcluster/scripts/misc/unpack-metal.py
        tooltool-downloads: internal
        toolchain-artifact: project/gecko/metal/metal.tar.zst
    fetches:
        toolchain:
            - linux64-7zz
    # Expiry similar to that of fetches
    expires-after: 1000 years
